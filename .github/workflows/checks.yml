name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py test
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-for-automated-checks-only-not-for-production-0123456789
      - run: python manage.py check --deploy
        working-directory: backend
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-secret-key-for-automated-checks-only-not-for-production-0123456789
          DJANGO_ALLOWED_HOSTS: algoquest.example.vercel.app
          CSRF_TRUSTED_ORIGINS: https://algoquest.example.vercel.app
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
